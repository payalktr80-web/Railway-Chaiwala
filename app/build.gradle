plugins {
    id 'com.android.application'
}

android {
    namespace 'com.drcocktail.railwaychaiwala'
    compileSdk 36

    defaultConfig {
        applicationId "com.drcocktail.railwaychaiwala"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure native framework - zero external library dependencies
}
