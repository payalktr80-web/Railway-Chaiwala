name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailwayChaiWala-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Railway Chai Wala Android Release v1.0.0
          body: |
            ### 🚂 Railway Chai Wala (रेलवे चाय वाला) - Android APK v1.0.0
            
            Android APK release with on-screen touch controls:
            - 🕹️ **Virtual Analog Joystick**: Move character across the chai stall.
            - 🤝 **SPACE BAR Button**: Interact with stations, brew chai, advance dialogue.
            - ❌ **Q Button**: Cancel, drop held items, turn off stove.
            
            Download `app-debug.apk` below and install on any Android device (Android 7.0+).
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
